<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liked Posts - Forum</title>
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo-link">
                <h1 class="logo">Forum</h1>
            </a>
            <button class="hamburger-btn">
                <i class="fas fa-bars"></i>
            </button>
            <div class="nav-right">
                <button id="create-post-btn" class="btn btn-primary" onclick="window.location.href='/create'">
                    <i class="fas fa-plus"></i> Create Post
                </button>
                <button class="btn btn-outline" onclick="window.location.href='/profile/{{.UserID}}'">
                    <i class="fas fa-user"></i> Profile
                </button>
                <button class="btn btn-primary" onclick="window.location.href='/logout'">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <h2>Posts You've Liked</h2>
            <button class="btn btn-primary" onclick="window.location.href='/'">
                <i class="fas fa-home"></i> Back to Home
            </button>
        </div>
        
        <div class="posts-container">
            {{range .Posts}}
            <div class="post">
                <div class="post-header">
                    <img src="{{if .ProfilePic}}{{.ProfilePic}}{{else}}/static/default-profile.png{{end}}" alt="Profile" class="profile-pic">
                    <span class="username">{{.Username}}</span>
                    <span class="post-time">{{.PostTime}}</span>
                </div>
                <h3 class="post-title">{{.Title}}</h3>
                <div class="post-content">
                    <p>{{.Content}}</p>
                    {{if .ImagePath}}
                    <img src="{{.ImagePath}}" alt="Post image" class="post-image" onerror="this.onerror=null; this.src='/static/images/placeholder.png';">
                    {{end}}
                </div>
                <div class="post-categories">
                    {{range .Categories}}
                    <span class="category-tag">{{.Name}}</span>
                    {{end}}
                </div>
                <div class="post-footer">
                    <div class="action-container">
                        <button class="action-btn like-btn" onclick="event.stopPropagation();" data-post-id="{{.ID}}" data-action="like">
                            <i class="fas fa-heart"></i>
                            <span class="count" id="likes-{{.ID}}">{{.Likes}}</span>
                        </button>
                    </div>
                    <div class="action-container">
                        <button class="action-btn comment-btn" data-post-id="{{.ID}}" onclick="window.location.href='/?id={{.ID}}'">
                            <i class="fas fa-comment"></i>
                            <span class="count" id="comments-{{.ID}}">{{.CommentCount}}</span>
                        </button>
                    </div>
                    <div class="action-container">
                        <button class="action-btn dislike-btn" onclick="event.stopPropagation();" data-post-id="{{.ID}}" data-action="dislike">
                            <i class="fas fa-thumbs-down"></i>
                            <span class="count" id="dislikes-{{.ID}}">{{.Dislikes}}</span>
                        </button>
                    </div>
                </div>
            </div>
            {{end}}
        </div>
    </main>

    <div class="categories-filter-container"> 
        <h3>Filter Posts by:</h3>
        <ul>
            <li><a href="/created">Created Posts</a></li>
        </ul>
    </div>

    <script src="/static/js/like.js"></script>
</body>
</html>
