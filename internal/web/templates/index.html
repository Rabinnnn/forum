<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo-link">
                <h1 class="logo">Forum</h1>
            </a>
            <div class="nav-right">
                {{if .IsLoggedIn}}
                    <button id="create-post-btn" class="btn btn-primary" onclick="window.location.href='/create'">
                        <i class="fas fa-plus"></i> Create Post
                    </button>
                    {{if .User}}
                        <span class="username">Welcome, {{.User.Username}}</span>
                        <button class="btn btn-outline" onclick="window.location.href='/profile/{{.User.ID}}'">
                            <i class="fas fa-user"></i> Profile
                        </button>
                    {{end}}
                    <button class="btn btn-primary" onclick="window.location.href='/logout'">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                {{else}}
                    <button class="btn btn-outline" onclick="window.location.href='/login'">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                    <button class="btn btn-primary" onclick="window.location.href='/register'">
                        <i class="fas fa-user-plus"></i> Sign Up
                    </button>
                {{end}}
            </div>
        </div>
    </nav>

    <main class="main-content">
        {{if .Posts}}
            <div class="posts-container">
                {{range .Posts}}
                    <div class="post">
                        <h2>{{.Title}}</h2>
                        <p>{{.Content}}</p>
                        {{if .ImagePath}}
                            <img src="{{.ImagePath}}" alt="Post image" class="post-image" onerror="this.onerror=null; this.src='/static/images/placeholder.png';">
                        {{end}}
                        <div class="post-footer">
                            <div class="action-container">
                                <button class="action-btn like-btn" data-post-id="{{.ID}}" data-action="like">
                                    <i class="fas fa-heart"></i>
                                    <span class="count" id="likes-{{.ID}}">{{.Likes}}</span>
                                </button>
                            </div>
                            <div class="action-container">
                                <button class="action-btn comment-btn" data-post-id="{{.ID}}">
                                    <i class="fas fa-comment"></i>
                                    <span class="count" id="comments-{{.ID}}">{{.Comments}}</span>
                                </button>
                            </div>
                            <div class="action-container">
                                <button class="action-btn dislike-btn" data-post-id="{{.ID}}" data-action="dislike">
                                    <i class="fas fa-thumbs-down"></i>
                                    <span class="count" id="dislikes-{{.ID}}">{{.Dislikes}}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                {{end}}
            </div>
        {{else}}
            <div class="no-posts-container">
                <p class="no-posts">No posts available.</p>
                {{if .User}}
                    <button class="btn btn-primary create-first-post" onclick="window.location.href='/create'">
                        <i class="fas fa-plus"></i> Create Your First Post
                    </button>
                {{end}}
            </div>
        {{end}}
    </main>

    <script src="../static/js/like.js"></script>
</body>
</html>
